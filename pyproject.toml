[tool.poetry]
name = "moscow-housing-vacancy-rate"
version = "1.0"
description = "Moscow housing vacancy rate estimation based on open administrative and census data"
authors = ["Pavel Syomin <pas.ntg@gmail.com>"]
license = "CC-BY 4.0 International"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.3"
tqdm = "^4.67.1"
jupyter = "^1.1.1"
requests = "^2.32.3"
scikit-learn = "^1.6.1"
fuzzywuzzy = "^0.18.0"
python-levenshtein = "^0.27.1"
openpyxl = "^3.1.5"
fastparquet = "^2024.11.0"
matplotlib = "^3.10.1"
seaborn = "^0.13.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
